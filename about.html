<!DOCTYPE html>
<html>

    <head>
        <title>Gabriel | About Me.</title>
        <link rel="icon" href="assets/pageicon.png">
        <link rel="stylesheet" href="about.css">
        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
        <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400&display=swap" rel="stylesheet">
    </head>

    <body>
        <header>
            <div class="header-cont">
                <p class="headtext-1 hover-area" data-label="Home." onclick='window.location.href="index.html"'>Gabriel Shearer</p>
                <p class="headtext-1 hover-area" data-label="Projects." onclick='window.location.href="index.html#footer" '>Projects.</p>
            </div>
        </header>
        <div id="container">
            <div id="cube"> 
            </div>
        </div>
        <section class="about-section">
            <div class="about-section-cont">
                <div class="about-cont">
                    <h2 class="about-title">Hey, I'm</h2>
                    <p class="about-text">Gabriel! I’m a soon graduating college student from Essex, focused on costume, cosplay, fashion, prop, and textiles design.
</p>
                </div>
                <div class="about-img-cont">
                    <img class="about-img" src="assets/Profile Image HT2.png">
                </div>
            </div>
            
        </section>
    
    
        <script>

            const cube = $("#cube");

            /*--------------------
            Cube Follower Logic
            --------------------*/
            // 1. GLOBAL Mouse Movement
            $(document).on("mousemove", function (e) {
                cube.css({
                    transform: `translate(${e.pageX}px, ${e.pageY}px) translate(-50%, -50%)`
                });
            });

            // 2. Hover Enter
            $(".hover-area").on("mouseenter", function () {
                let projectTitle = $(this).data("label");
                cube.text(projectTitle);
                cube.addClass("active");
            });

            // 3. Hover Leave
            $(".hover-area").on("mouseleave", function () {
                cube.removeClass("active");
                setTimeout(() => {
                    if (!cube.hasClass("active")) cube.text(""); 
                }, 300);
            });

        </script>
    </body>

</html>
